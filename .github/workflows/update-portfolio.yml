name: Update Portfolio & Queue LinkedIn

on:
  repository_dispatch:
    types: [extension_update]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Portfolio Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install google-generativeai requests

      - name: Run Portfolio Website Updater
        env:
          PAYLOAD_EXTENSION_NAME: ${{ github.event.client_payload.extension_name }}
          PAYLOAD_DISPLAY_NAME: ${{ github.event.client_payload.display_name }}
          PAYLOAD_VERSION: ${{ github.event.client_payload.version }}
          PAYLOAD_COMMITS: ${{ toJson(github.event.client_payload.commits) }}
          PAYLOAD_IS_NEW: ${{ github.event.client_payload.is_new }}
        run: |
          python scripts/update_portfolio_site.py

      - name: Generate LinkedIn Post if New App
        if: ${{ github.event.client_payload.is_new == true }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PAYLOAD_EXTENSION_NAME: ${{ github.event.client_payload.extension_name }}
          PAYLOAD_DISPLAY_NAME: ${{ github.event.client_payload.display_name }}
          PAYLOAD_VERSION: ${{ github.event.client_payload.version }}
          PAYLOAD_COMMITS: ${{ toJson(github.event.client_payload.commits) }}
          PAYLOAD_IS_NEW: true
        run: |
          python scripts/generate_linkedin_posts.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff-index --quiet HEAD || git commit -m "auto: update portfolio for ${{ github.event.client_payload.extension_name }} v${{ github.event.client_payload.version }}"
          git push
