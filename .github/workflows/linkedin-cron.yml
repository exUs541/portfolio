name: Scheduled LinkedIn Posting

on:
  schedule:
    # Mittwoch um 10:00 UTC (12:00 Uhr deutsche Zeit)
    - cron: '0 10 * * 3'
  workflow_dispatch: # Ermoeglicht manuelles Ausloesen ueber das GitHub UI

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Portfolio Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install google-generativeai requests

      # Erzeugt nur dann einen Post (und setzt den Output weekly_post_dir), wenn es
      # seit dem letzten Post neue Updates im changelog.json gibt.
      - name: Generate Weekly Summary Post
        id: generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODE: weekly
        run: |
          python scripts/generate_linkedin_posts.py

      # Postet nur den in diesem Lauf erzeugten Wochen-Post (leer = keine Updates = kein Post)
      # sowie ggf. wartende New_App-Posts. Schlaegt das Posten fehl, wird der Lauf rot
      # und der "Commit"-Schritt unten wird nicht ausgefuehrt.
      - name: Publish Pending LinkedIn Posts (via API)
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_MEMBER_ID: ${{ secrets.LINKEDIN_MEMBER_ID }}
          WEEKLY_POST_DIR: ${{ steps.generate.outputs.weekly_post_dir }}
        run: |
          python scripts/publish_linkedin_actions.py

      - name: Commit Archived Posts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff-index --quiet HEAD || git commit -m "auto: archive published LinkedIn posts"
          git push
