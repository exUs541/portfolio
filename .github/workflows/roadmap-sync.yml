name: Sync Roadmap from Project

on:
  project_v2_item:
    types: [created, edited, moved, deleted, converted]
  workflow_dispatch: # Allows manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/checkout@v3
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Sync Script
        env:
          PROJECT_TOKEN: ${{ secrets.ROADMAP_PROJECT_TOKEN }}
        run: python scripts/sync_roadmap.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "exus-bot"
          git config --global user.email "bot@exus541.com"
          git add roadmap-data.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Automated Roadmap Sync [skip ci]"
          git push
