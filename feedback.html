<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Hub | exus541</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .feedback-container { padding: 150px 0 80px 0; max-width: 800px; margin: 0 auto; }
        .tab-switcher { display: flex; gap: 1rem; justify-content: center; margin-bottom: 3rem; background: var(--glass-bg); padding: 0.5rem; border-radius: 50px; border: 1px solid var(--glass-border); width: fit-content; margin-left: auto; margin-right: auto; }
        .tab-btn { padding: 0.8rem 2rem; border-radius: 40px; border: none; background: transparent; color: var(--text-dim); cursor: pointer; transition: all 0.3s ease; font-weight: 600; font-size: 1rem; display: flex; align-items: center; gap: 0.8rem; }
        .tab-btn.active { background: var(--accent-color); color: var(--bg-color); }
        
        .form-card { display: none; animation: fadeIn 0.5s ease; }
        .form-card.active { display: block; }
        
        form { display: grid; gap: 1.5rem; }
        .form-group { display: flex; flex-direction: column; gap: 0.5rem; }
        .form-group label { font-size: 0.85rem; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
        
        input, select, textarea { background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 12px; padding: 1rem; color: #fff; font-family: inherit; font-size: 1rem; transition: border-color 0.3s ease; appearance: none; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent-color); background: rgba(255,255,255,0.08); }
        
        select option { background: #1a1a1a; color: #fff; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        @media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } .tab-switcher { width: 100%; flex-direction: column; border-radius: 20px; } }
    </style>
</head>
<body>
    <div class="background-glow"></div>
    <nav>
        <div class="container">
            <a href="index.html" class="logo">exus<span>541</span></a>
            <div class="nav-links">
                <a href="extensions.html"><i data-lucide="puzzle"></i> <span>Extensions</span></a>
                <a href="roadmap.html"><i data-lucide="map"></i> <span>Roadmap</span></a>
                <a href="feedback.html" class="active"><i data-lucide="message-square"></i> <span>Feedback</span></a>
                <a href="index.html#about"><i data-lucide="info"></i> <span>About</span></a>
                <a href="https://www.patreon.com/c/exus541" class="btn-primary" target="_blank"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M15.386 0.501c-4.139 0-7.511 3.372-7.511 7.511 0 4.139 3.372 7.511 7.511 7.511s7.511-3.372 7.511-7.511c0-4.139-3.372-7.511-7.511-7.511zM0 0.501v22.998h4.28v-22.998h-4.28z"/></svg> <span>Support</span></a>
            </div>
        </div>
    </nav>

    <main class="container">
        <div class="feedback-container">
            <div class="section-header" style="text-align: center; margin-bottom: 3rem;">
                <h1>Feedback <span>Hub</span></h1>
                <p>Have an idea or found a bug? Let's make these tools better together.</p>
            </div>

            <div class="tab-switcher">
                <button class="tab-btn active" onclick="switchTab('idea')"><i data-lucide="lightbulb"></i> Suggest an Idea</button>
                <button class="tab-btn" onclick="switchTab('bug')"><i data-lucide="bug"></i> Report a Bug</button>
            </div>

            <!-- Idea Form -->
            <div id="idea-form" class="form-card active glass" style="padding: 3rem; border-radius: 30px;">
                <form action="https://formspree.io/f/mrejndno" method="POST">
                    <input type="hidden" name="form_type" value="New Idea">
                    <div class="grid-2">
                        <div class="form-group">
                            <label>Your Name</label>
                            <input type="text" name="name" placeholder="John Doe" required>
                        </div>
                        <div class="form-group">
                            <label>Email Address</label>
                            <input type="email" name="email" placeholder="john@example.com" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Target Extension</label>
                        <select name="project" required>
                            <option value="general">General / New Project</option>
                            <option value="siteblocker">SiteBlocker</option>
                            <option value="tabmaster">TabMaster</option>
                            <option value="webnote">WebNote</option>
                            <option value="ytfilter">YT Filter</option>
                            <option value="sapsignavio">SAP Signavio Booster</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>The Idea</label>
                        <textarea name="message" rows="5" placeholder="Describe your feature request in detail..." required></textarea>
                    </div>
                    <button type="submit" class="btn-primary" style="width: 100%; padding: 1.2rem;">Submit Idea <i data-lucide="send"></i></button>
                </form>
            </div>

            <!-- Bug Form -->
            <div id="bug-form" class="form-card glass" style="padding: 3rem; border-radius: 30px;">
                <form action="https://formspree.io/f/mdabqjqv" method="POST">
                    <input type="hidden" name="form_type" value="Bug Report">
                    <div class="grid-2">
                        <div class="form-group">
                            <label>Your Name</label>
                            <input type="text" name="name" placeholder="John Doe" required>
                        </div>
                        <div class="form-group">
                            <label>Email Address</label>
                            <input type="email" name="email" placeholder="john@example.com" required>
                        </div>
                    </div>
                    <div class="grid-2">
                        <div class="form-group">
                            <label>Affected Extension</label>
                            <select name="project" required>
                                <option value="siteblocker">SiteBlocker</option>
                                <option value="tabmaster">TabMaster</option>
                                <option value="webnote">WebNote</option>
                                <option value="ytfilter">YT Filter</option>
                                <option value="sapsignavio">SAP Signavio Booster</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Browser / OS</label>
                            <input type="text" name="environment" placeholder="Chrome on Windows 11" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Steps to Reproduce</label>
                        <textarea name="steps" rows="4" placeholder="1. Open popup... 2. Click settings..." required></textarea>
                    </div>
                    <div class="form-group">
                        <label>Bug Description</label>
                        <textarea name="message" rows="4" placeholder="What exactly is happening?" required></textarea>
                    </div>
                    <button type="submit" class="btn-primary" style="width: 100%; padding: 1.2rem; background: #ff4444; border-color: #ff4444;">Submit Bug Report <i data-lucide="alert-circle"></i></button>
                </form>
            </div>
        </div>
    </main>

    <footer style="margin-top: 100px;"><div class="container"><p>&copy; 2026 exus541. All rights reserved.</p></div></footer>

    <script>
        function switchTab(type) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.form-card').forEach(card => card.classList.remove('active'));
            
            if (type === 'idea') {
                document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
                document.getElementById('idea-form').classList.add('active');
            } else {
                document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
                document.getElementById('bug-form').classList.add('active');
            }
            lucide.createIcons();
        }
        lucide.createIcons();
    </script>
</body>
</html>
