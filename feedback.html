<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback | M54</title>
    <meta name="description" content="Idee oder Fehler? Schick uns dein Feedback zu unseren Browser-Extensions und Apps.">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script>document.documentElement.classList.add('js');</script>
</head>
<body>
    <a class="skip" href="#main" data-i18n="skip">Zum Inhalt springen</a>

    <header class="site-header">
        <div class="container header-inner">
            <a href="index.html" class="brand" aria-label="M54 – Startseite">M<span>54</span></a>
            <nav class="nav" id="nav" aria-label="Hauptnavigation" data-i18n-aria="nav.menu">
                <a href="index.html#loesungen" data-i18n="nav.solutions">Lösungen</a>
                <a href="index.html#zeitplan" data-i18n="nav.timeline">Zeitplan</a>
                <a href="index.html#about" data-i18n="nav.about">Über uns</a>
                <a href="roadmap.html" data-i18n="nav.roadmap">Roadmap</a>
                <a href="feedback.html" aria-current="page" data-i18n="nav.feedback">Feedback</a>
                <a href="index.html#support" class="nav-support" data-i18n="nav.support">Unterstützen</a>
            </nav>
            <div class="header-actions">
                <div class="lang" data-lang-menu></div>
                <a class="btn btn-warm btn-sm header-cta" href="index.html#support"><span data-icon="heart"></span><span data-i18n="nav.support">Unterstützen</span></a>
                <button type="button" class="icon-btn menu-btn" aria-expanded="false" aria-controls="nav" aria-label="Menü" data-i18n-aria="nav.menu"><span data-icon="menu"></span></button>
            </div>
        </div>
    </header>

    <main id="main" class="container page-body">
        <div class="page-head">
            <a class="back" href="index.html"><span data-icon="arrow-left"></span><span data-i18n="rm.back">Zurück zur Übersicht</span></a>
            <h1 data-i18n="f.title">Feedback-Zentrale</h1>
            <p data-i18n="f.sub">Du hast eine Idee oder einen Fehler gefunden? Lass uns diese Tools gemeinsam besser machen.</p>
        </div>

        <div class="tabs" role="tablist">
            <button type="button" class="tab" role="tab" id="tab-idea" aria-controls="idea-form" aria-selected="true" data-tab="idea"><span data-icon="lightbulb"></span><span data-i18n="f.tab.idea">Idee einreichen</span></button>
            <button type="button" class="tab" role="tab" id="tab-bug" aria-controls="bug-form" aria-selected="false" data-tab="bug"><span data-icon="alert"></span><span data-i18n="f.tab.bug">Fehler melden</span></button>
        </div>

        <!-- Idee -->
        <div id="idea-form" class="form-card active" role="tabpanel" aria-labelledby="tab-idea">
            <form action="https://formspree.io/f/mrejndno" method="POST">
                <input type="hidden" name="form_type" value="New Idea">
                <div class="row-2">
                    <div class="field"><label for="i-name" data-i18n="f.name">Dein Name</label><input id="i-name" type="text" name="name" placeholder="Alex Beispiel" data-i18n-ph="f.name.ph" required></div>
                    <div class="field"><label for="i-mail" data-i18n="f.email">E-Mail-Adresse (optional)</label><input id="i-mail" type="email" name="email" placeholder="alex@beispiel.de" data-i18n-ph="f.email.ph"></div>
                </div>
                <div class="field">
                    <label for="i-project" data-i18n="f.target">Zu welchem Projekt?</label>
                    <select id="i-project" name="project" class="project-select" required>
                        <option value="general" data-i18n="f.general">Allgemein / neues Projekt</option>
                    </select>
                </div>
                <div class="field"><label for="i-msg" data-i18n="f.idea">Deine Idee</label><textarea id="i-msg" name="message" rows="5" placeholder="Beschreibe deinen Wunsch möglichst genau …" data-i18n-ph="f.idea.ph" required></textarea></div>
                <button type="submit" class="btn btn-dark"><span data-i18n="f.send.idea">Idee absenden</span><span data-icon="send"></span></button>
            </form>
        </div>

        <!-- Fehler -->
        <div id="bug-form" class="form-card" role="tabpanel" aria-labelledby="tab-bug">
            <form action="https://formspree.io/f/mdabqjqv" method="POST">
                <input type="hidden" name="form_type" value="Bug Report">
                <div class="row-2">
                    <div class="field"><label for="b-name" data-i18n="f.name">Dein Name</label><input id="b-name" type="text" name="name" placeholder="Alex Beispiel" data-i18n-ph="f.name.ph" required></div>
                    <div class="field"><label for="b-mail" data-i18n="f.email">E-Mail-Adresse (optional)</label><input id="b-mail" type="email" name="email" placeholder="alex@beispiel.de" data-i18n-ph="f.email.ph"></div>
                </div>
                <div class="row-2">
                    <div class="field"><label for="b-project" data-i18n="f.affected">Betroffenes Projekt</label><select id="b-project" name="project" class="project-select" required></select></div>
                    <div class="field"><label for="b-env" data-i18n="f.env">Browser / Gerät</label><input id="b-env" type="text" name="environment" placeholder="Chrome unter Windows 11, Meta Quest 3 …" data-i18n-ph="f.env.ph" required></div>
                </div>
                <div class="field"><label for="b-steps" data-i18n="f.steps">So kann man den Fehler nachstellen</label><textarea id="b-steps" name="steps" rows="4" placeholder="1. Popup öffnen … 2. Einstellungen anklicken …" data-i18n-ph="f.steps.ph" required></textarea></div>
                <div class="field"><label for="b-msg" data-i18n="f.desc">Fehlerbeschreibung</label><textarea id="b-msg" name="message" rows="4" placeholder="Was genau passiert?" data-i18n-ph="f.desc.ph" required></textarea></div>
                <button type="submit" class="btn btn-warm"><span data-i18n="f.send.bug">Fehlerbericht absenden</span><span data-icon="alert"></span></button>
            </form>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <div class="footer-inner">
                <div class="footer-links">
                    <a href="index.html" class="brand" style="margin-right: 8px;">M<span>54</span></a>
                    <span data-i18n="foot.rights">© {year} M54. Mit Hingabe gebaut – in der Freizeit.</span>
                    <a href="privacy.html" data-i18n="foot.privacy">Datenschutz</a>
                </div>
            </div>
        </div>
    </footer>

    <script src="site.js"></script>
    <script>
    (function () {
        'use strict';
        var X = window.EXUS;

        /* Tabs (auch per Link-Anker #idea / #bug erreichbar) */
        function showTab(name) {
            if (name !== 'idea' && name !== 'bug') name = 'idea';
            document.querySelectorAll('.tab').forEach(function (t) { t.setAttribute('aria-selected', String(t.dataset.tab === name)); });
            document.getElementById('idea-form').classList.toggle('active', name === 'idea');
            document.getElementById('bug-form').classList.toggle('active', name === 'bug');
        }
        document.querySelectorAll('.tab').forEach(function (t) {
            t.addEventListener('click', function () { showTab(t.dataset.tab); try { history.replaceState(null, '', '#' + t.dataset.tab); } catch (e) { /* ignorieren */ } });
        });
        showTab(location.hash.replace('#', ''));
        window.addEventListener('hashchange', function () { showTab(location.hash.replace('#', '')); });

        /* Projektliste aus projects.json (bleibt automatisch aktuell) */
        var preset = new URLSearchParams(location.search).get('projekt');
        var projects = [];
        function fillSelects() {
            document.querySelectorAll('.project-select').forEach(function (sel) {
                var keep = sel.value;
                var isIdea = sel.id === 'i-project';
                var html = isIdea ? '<option value="general">' + (X.lang === 'en' ? 'General / new project' : 'Allgemein / neues Projekt') + '</option>' : '';
                projects.forEach(function (p) {
                    html += '<option value="' + p.id + '">' + p.name.replace(/&/g, '&amp;') + '</option>';
                });
                sel.innerHTML = html;
                if (keep && sel.querySelector('option[value="' + keep + '"]')) sel.value = keep;
                else if (preset && sel.querySelector('option[value="' + preset + '"]')) sel.value = preset;
            });
        }
        X.onLang(fillSelects);
        fetch('projects.json', { cache: 'no-cache' })
            .then(function (r) { return r.json(); })
            .then(function (d) {
                projects = d.projects.slice().sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
                fillSelects();
            })
            .catch(function () {
                /* Fallback: einfache Standardliste, damit die Formulare immer nutzbar bleiben */
                projects = [['siteblocker', 'Search Filter & Site Blocker'], ['tabmaster', 'TabMaster'], ['webnote', 'WebNote'], ['ytfilter', 'YouTube Channel Blocker'], ['sapsignavio', 'SAP Signavio Quick Switch']].map(function (a) { return { id: a[0], name: a[1] }; });
                fillSelects();
            });
    })();
    </script>
</body>
</html>
