<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roadmap | exus541</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Roadmap Specific Styles */
        .timeline-container {
            padding: 100px 0;
            text-align: center;
        }
        .timeline {
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            max-width: 1000px;
            margin: 50px auto;
            padding: 0 20px;
        }
        .timeline::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50px;
            right: 50px;
            height: 2px;
            background: var(--glass-border);
            z-index: 1;
        }
        .timeline-node {
            position: relative;
            z-index: 2;
            background: var(--bg-color);
            border: 2px solid var(--accent-color);
            width: 20px;
            height: 20px;
            border-radius: 50%;
            box-shadow: 0 0 15px var(--accent-glow);
        }
        .timeline-content {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
        }
        .timeline-content h4 { font-size: 1.2rem; color: var(--accent-color); margin-bottom: 5px; }
        .timeline-content p { font-size: 0.9rem; color: var(--text-dim); }

        .filter-bar {
            margin-bottom: 40px;
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 0.6rem 1.5rem;
            border-radius: 50px;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            color: var(--text-dim);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .filter-btn.active {
            background: var(--accent-color);
            color: var(--bg-color);
            border-color: var(--accent-color);
            font-weight: 600;
        }

        .project-list {
            display: grid;
            gap: 1.5rem;
            max-width: 900px;
            margin: 0 auto;
        }
        .project-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem;
            border-radius: 20px;
        }
        .project-info h3 { margin-bottom: 0.5rem; }
        .vote-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }
        .vote-btn {
            background: none;
            border: 1px solid var(--glass-border);
            color: var(--text-color);
            padding: 0.8rem 1.2rem;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
        }
        .vote-btn:hover:not(:disabled) {
            border-color: var(--accent-color);
            background: rgba(0, 242, 255, 0.1);
        }
        .vote-btn.voted {
            background: var(--accent-color);
            color: var(--bg-color);
            border-color: var(--accent-color);
        }
        .vote-count { font-weight: 700; font-size: 1.2rem; }
    </style>
</head>
<body>
    <div class="background-glow"></div>
    
    <nav>
        <div class="container">
            <a href="index.html" class="logo">exus<span>541</span></a>
                        <div class="nav-links">
                <a href="index.html#extensions" title="Extensions"><i data-lucide="puzzle"></i></a>
                <a href="roadmap.html" title="Roadmap"><i data-lucide="map"></i></a>
                <a href="index.html#feedback" title="Feedback"><i data-lucide="message-square"></i></a>
                <a href="index.html#about" title="About"><i data-lucide="info"></i></a>
                <a href="index.html#socials" title="Socials"><i data-lucide="share-2"></i></a>
                <a href="https://www.buymeacoffee.com/YOUR_USERNAME" class="btn-primary" target="_blank" title="Support with a Coffee"><i data-lucide="coffee"></i></a>
            </div>
        </div>
    </nav>

    <main class="container">
        <section class="timeline-container">
            <h1 class="reveal">Project <span>Journey</span></h1>
            <p>From the first line of code to the future of browsing.</p>

            <div class="timeline">
                <div class="timeline-node" style="left:0">
                    <div class="timeline-content">
                        <h4>Past</h4>
                        <p>Foundation & First Extensions (v1.0)</p>
                    </div>
                </div>
                <div class="timeline-node" style="left:50%">
                    <div class="timeline-content">
                        <h4>Present</h4>
                        <p>Store Launch & Community Hub</p>
                    </div>
                </div>
                <div class="timeline-node" style="left:100%">
                    <div class="timeline-content">
                        <h4>Future</h4>
                        <p>Cross-Platform & Pro Features</p>
                    </div>
                </div>
            </div>
        </section>

        <section class="projects-section">
            <div class="section-header">
                <h2>Project Explorer</h2>
                <p>Vote for the features you want to see next.</p>
            </div>

            <div class="filter-bar">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="extension">Extensions</button>
                <button class="filter-btn" data-filter="web">Web Tools</button>
                <button class="filter-btn" data-filter="planned">Planned</button>
            </div>

            <div class="project-list" id="projectList">
                <!-- Projects will be injected by JS -->
            </div>
        </section>
    </main>

    <footer style="margin-top: 100px;">
        <div class="container">
            <p>&copy; 2026 exus541. Built with ❤️</p>
        </div>
    </footer>

    <script>
        const projects = [
            { id: 1, title: "Cloud Sync Engine", desc: "Sync your WebNote and SiteBlocker rules across browsers.", category: "planned", votes: 142 },
            { id: 2, title: "TabMaster Pro", desc: "Advanced tab group management and automated workflows.", category: "extension", votes: 89 },
            { id: 3, title: "Firefox Support", desc: "Porting all extensions to the Firefox browser.", category: "planned", votes: 215 },
            { id: 4, title: "Global Settings Hub", desc: "One dashboard to control all exus541 tools.", category: "web", votes: 67 },
            { id: 5, title: "Mobile Companion", desc: "A mobile app to manage your browser tools on the go.", category: "planned", votes: 45 }
        ];

        function renderProjects(filter = 'all') {
            const list = document.getElementById('projectList');
            list.innerHTML = '';
            
            const filtered = filter === 'all' ? projects : projects.filter(p => p.category === filter);
            
            filtered.sort((a, b) => b.votes - a.votes).forEach(p => {
                const isVoted = localStorage.getItem(`voted_${p.id}`);
                const card = document.createElement('div');
                card.className = 'project-card glass';
                card.innerHTML = `
                    <div class="project-info">
                        <span class="roadmap-tag">${p.category}</span>
                        <h3>${p.title}</h3>
                        <p>${p.desc}</p>
                    </div>
                    <div class="vote-section">
                        <span class="vote-count">${p.votes}</span>
                        <button class="vote-btn ${isVoted ? 'voted' : ''}" onclick="toggleVote(${p.id})" ${isVoted ? 'disabled' : ''}>
                            <i data-lucide="thumbs-up"></i> ${isVoted ? 'Voted' : 'Vote'}
                        </button>
                    </div>
                `;
                list.appendChild(card);
            });
            lucide.createIcons();
        }

        function toggleVote(id) {
            if (localStorage.getItem(`voted_${id}`)) return;
            
            const project = projects.find(p => p.id === id);
            project.votes++;
            localStorage.setItem(`voted_${id}`, 'true');
            renderProjects(document.querySelector('.filter-btn.active').dataset.filter);
        }

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelector('.filter-btn.active').classList.remove('active');
                e.target.classList.add('active');
                renderProjects(e.target.dataset.filter);
            });
        });

        renderProjects();
    </script>
</body>
</html>
