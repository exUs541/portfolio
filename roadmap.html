<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roadmap | exus541</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Roadmap Specific Styles */
        .timeline-container { padding: 100px 0; text-align: center; }
        .timeline { display: flex; justify-content: space-between; align-items: center; position: relative; max-width: 1000px; margin: 50px auto; padding: 0 20px; }
        .timeline::before { content: ''; position: absolute; top: 50%; left: 50px; right: 50px; height: 2px; background: var(--glass-border); z-index: 1; }
        .timeline-node { position: relative; z-index: 2; background: var(--bg-color); border: 2px solid var(--accent-color); width: 20px; height: 20px; border-radius: 50%; box-shadow: 0 0 15px var(--accent-glow); }
        .timeline-content { position: absolute; top: 40px; left: 50%; transform: translateX(-50%); width: 200px; }
        .timeline-content h4 { font-size: 1.2rem; color: var(--accent-color); margin-bottom: 5px; }
        .timeline-content p { font-size: 0.9rem; color: var(--text-dim); }

        .controls-bar { 
            margin-bottom: 50px; 
            display: flex; 
            gap: 2rem; 
            justify-content: center; 
            align-items: center; 
            flex-wrap: wrap;
            background: var(--glass-bg);
            padding: 1.5rem;
            border-radius: 50px;
            border: 1px solid var(--glass-border);
            max-width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }
        .filter-group, .sort-group { display: flex; gap: 0.8rem; align-items: center; }
        .label { font-size: 0.8rem; color: var(--text-dim); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }

        .filter-btn, .sort-select { padding: 0.5rem 1rem; border-radius: 50px; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.05); color: var(--text-dim); cursor: pointer; transition: all 0.3s ease; font-size: 0.9rem; }
        .filter-btn.active { background: var(--accent-color); color: var(--bg-color); border-color: var(--accent-color); font-weight: 600; }
        
        .project-list { display: grid; gap: 1.5rem; max-width: 900px; margin: 0 auto; }
        .project-card { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 2rem; 
            border-radius: 20px; 
            cursor: pointer;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        .project-card:hover { transform: translateY(-3px); border-color: var(--accent-color); }
        .project-info { flex: 1; }
        .project-info h3 { margin-bottom: 0.5rem; }
        
        /* Voting */
        .vote-controls { display: flex; align-items: center; gap: 1rem; margin-left: 2rem; cursor: default; }
        .vote-btn-group { display: flex; flex-direction: column; gap: 0.3rem; align-items: center; }
        .vote-arrow { background: none; border: 1px solid var(--glass-border); color: var(--text-dim); width: 36px; height: 36px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s ease; }
        .vote-arrow:hover:not(:disabled) { border-color: var(--accent-color); color: var(--accent-color); }
        .vote-arrow.active-up { background: #00ff88; color: #050508; border-color: #00ff88; }
        .vote-arrow.active-down { background: #ff4444; color: #fff; border-color: #ff4444; }
        .vote-score { font-weight: 800; font-size: 1.4rem; min-width: 40px; text-align: center; }

        /* Modal */
        .modal-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
            display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content { 
            background: var(--bg-color); border: 1px solid var(--glass-border); 
            padding: 3rem; border-radius: 30px; max-width: 600px; width: 90%;
            position: relative; box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        .close-modal { position: absolute; top: 20px; right: 20px; cursor: pointer; color: var(--text-dim); }
        .modal-header { margin-bottom: 2rem; }
        .modal-header h2 { font-size: 2.2rem; margin-bottom: 0.5rem; }
        .modal-body p { line-height: 1.8; color: var(--text-dim); font-size: 1.1rem; }

        .status-tag { padding: 0.3rem 0.8rem; border-radius: 4px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; margin-bottom: 0.8rem; display: inline-block; }
        .status-planned { background: rgba(0, 242, 255, 0.1); color: #00f2ff; }
        .status-progress { background: rgba(255, 170, 0, 0.1); color: #ffaa00; }
        .status-released { background: rgba(0, 255, 136, 0.1); color: #00ff88; }
        .status-backlog { background: rgba(255, 255, 255, 0.1); color: #ccc; }

        @media (max-width: 768px) {
            .controls-bar { border-radius: 20px; flex-direction: column; gap: 1rem; }
        }
    </style>
</head>
<body>
    <div class="background-glow"></div>
    
    <nav>
        <div class="container">
            <a href="index.html" class="logo">exus<span>541</span></a>
            <div class="nav-links">
                <a href="index.html#extensions"><i data-lucide="puzzle"></i> <span>Extensions</span></a>
                <a href="roadmap.html" class="active"><i data-lucide="map"></i> <span>Roadmap</span></a>
                <a href="index.html#feedback"><i data-lucide="message-square"></i> <span>Feedback</span></a>
                <a href="index.html#about"><i data-lucide="info"></i> <span>About</span></a>
                <a href="index.html#socials"><i data-lucide="share-2"></i> <span>Socials</span></a>
                <a href="https://www.patreon.com/c/exus541" class="btn-primary" target="_blank"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M15.386 0.501c-4.139 0-7.511 3.372-7.511 7.511 0 4.139 3.372 7.511 7.511 7.511s7.511-3.372 7.511-7.511c0-4.139-3.372-7.511-7.511-7.511zM0 0.501v22.998h4.28v-22.998h-4.28z"/></svg> <span>Support on Patreon</span></a>
            </div>
        </div>
    </nav>

    <main class="container">
        <section class="timeline-container">
            <h1 class="reveal">Project <span>Journey</span></h1>
            <p>Transparency in development. Explore what's next for exus541 tools.</p>
            <div class="timeline">
                <div class="timeline-node" style="left:0"><div class="timeline-content"><h4>Past</h4><p>Foundation & v1.0</p></div></div>
                <div class="timeline-node" style="left:50%"><div class="timeline-content"><h4>Present</h4><p>Community & Growth</p></div></div>
                <div class="timeline-node" style="left:100%"><div class="timeline-content"><h4>Future</h4><p>Innovation & Pro Suite</p></div></div>
            </div>
        </section>

        <section class="projects-section">
            <div class="controls-bar">
                <div class="filter-group">
                    <span class="label">Filter:</span>
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="backlog">Backlog</button>
                    <button class="filter-btn" data-filter="planned">Planned</button>
                    <button class="filter-btn" data-filter="progress">In Progress</button>
                    <button class="filter-btn" data-filter="released">Umgesetzt</button>
                </div>
                <div class="sort-group">
                    <span class="label">Sort By:</span>
                    <select class="sort-select" id="sortSelect">
                        <option value="votes">Top Upvotes</option>
                        <option value="az">Name (A-Z)</option>
                        <option value="status">Status Priority</option>
                    </select>
                </div>
            </div>

            <div class="project-list" id="projectList">
                <!-- Projects injected by JS -->
            </div>
        </section>
    </main>

    <!-- Modal for Project Details -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal()">
        <div class="modal-content glass" onclick="event.stopPropagation()">
            <div class="close-modal" onclick="closeModal()"><i data-lucide="x"></i></div>
            <div id="modalBody">
                <!-- Content injected by JS -->
            </div>
        </div>
    </div>

    <footer style="margin-top: 100px;">
        <div class="container">
            <p>&copy; 2026 exus541. Built with ❤️</p>
        </div>
    </footer>

    <script>
        const projects = [
            { id: 1, title: "Cloud Sync Engine", desc: "Sync your rules across browsers.", fullDesc: "The Cloud Sync Engine will allow users to securely sync their configurations, blocklists, and notes across multiple browsers and devices. It uses a lightweight, encrypted synchronization protocol to ensure your data stays private while being available wherever you work.", status: "planned", votes: 0 },
            { id: 2, title: "TabMaster Pro", desc: "Advanced tab group management.", fullDesc: "TabMaster Pro takes workspace organization to the next level. Features include automated tab grouping based on AI patterns, persistent sessions that survive browser restarts, and a 'Zen Mode' that hides all but your active project tabs.", status: "progress", votes: 0 },
            { id: 3, title: "Firefox Support", desc: "Porting all extensions to Firefox.", fullDesc: "We are committed to the open web. This initiative involves rewriting the core logic of all our extensions to be fully compatible with Firefox's Manifest V3 implementation, ensuring a seamless experience for Firefox users.", status: "planned", votes: 0 },
            { id: 4, title: "Global Settings Hub", desc: "One dashboard for all tools.", fullDesc: "Instead of managing each extension individually, the Global Settings Hub provides a central dashboard where you can configure all exus541 tools from a single interface. This includes global shortcuts, theme settings, and update notifications.", status: "backlog", votes: 0 },
            { id: 5, title: "Web Store Launch", desc: "Extensions now live on Chrome.", fullDesc: "All core browser extensions have successfully passed the Google Web Store review and are now available for public installation. This milestone ensures automated updates and verified security for all our users.", status: "released", votes: 0 },
            { id: 6, title: "Feedback Hub", desc: "Integrated community feedback system.", fullDesc: "A dedicated system for users to report bugs, suggest features, and vote on the development roadmap. This ensures that our development focus is always aligned with the needs of the community.", status: "released", votes: 0 }
        ];

        const statusOrder = { "progress": 0, "planned": 1, "backlog": 2, "released": 3 };

        function renderProjects() {
            const list = document.getElementById('projectList');
            const filter = document.querySelector('.filter-btn.active').dataset.filter;
            const sort = document.getElementById('sortSelect').value;
            
            list.innerHTML = '';
            let filtered = filter === 'all' ? [...projects] : projects.filter(p => p.status === filter);
            
            if (sort === 'votes') filtered.sort((a, b) => b.votes - a.votes);
            else if (sort === 'az') filtered.sort((a, b) => a.title.localeCompare(b.title));
            else if (sort === 'status') filtered.sort((a, b) => statusOrder[a.status] - statusOrder[b.status]);

            filtered.forEach(p => {
                const userVote = localStorage.getItem(`vote_${p.id}`);
                const card = document.createElement('div');
                card.className = 'project-card glass';
                card.onclick = () => openModal(p.id);
                card.innerHTML = `
                    <div class="project-info">
                        <span class="status-tag status-${p.status}">${p.status === 'released' ? 'Umgesetzt' : p.status}</span>
                        <h3>${p.title}</h3>
                        <p>${p.desc}</p>
                    </div>
                    <div class="vote-controls" onclick="event.stopPropagation()">
                        <div class="vote-score">${p.votes}</div>
                        <div class="vote-btn-group">
                            <button class="vote-arrow ${userVote === 'up' ? 'active-up' : ''}" onclick="handleVote(${p.id}, 'up')" title="Upvote">
                                <i data-lucide="chevron-up"></i>
                            </button>
                            <button class="vote-arrow ${userVote === 'down' ? 'active-down' : ''}" onclick="handleVote(${p.id}, 'down')" title="Downvote">
                                <i data-lucide="chevron-down"></i>
                            </button>
                        </div>
                    </div>
                `;
                list.appendChild(card);
            });
            lucide.createIcons();
        }

        function openModal(id) {
            const p = projects.find(item => item.id === id);
            const body = document.getElementById('modalBody');
            body.innerHTML = `
                <div class="modal-header">
                    <span class="status-tag status-${p.status}">${p.status === 'released' ? 'Umgesetzt' : p.status}</span>
                    <h2>${p.title}</h2>
                </div>
                <div class="modal-body">
                    <p>${p.fullDesc}</p>
                </div>
            `;
            document.getElementById('modalOverlay').style.display = 'flex';
            lucide.createIcons();
        }

        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
        }

        function handleVote(id, type) {
            const project = projects.find(p => p.id === id);
            const currentVote = localStorage.getItem(`vote_${id}`);
            if (currentVote === type) {
                project.votes += (type === 'up' ? -1 : 1);
                localStorage.removeItem(`vote_${id}`);
            } else {
                if (currentVote) project.votes += (currentVote === 'up' ? -1 : 1);
                project.votes += (type === 'up' ? 1 : -1);
                localStorage.setItem(`vote_${id}`, type);
            }
            renderProjects();
        }

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelector('.filter-btn.active').classList.remove('active');
                e.target.classList.add('active');
                renderProjects();
            });
        });

        document.getElementById('sortSelect').addEventListener('change', renderProjects);
        renderProjects();
    </script>
</body>
</html>
