<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roadmap | exus541</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Roadmap Specific Styles */
        .timeline-container { padding: 150px 0 80px 0; text-align: center; }
        .timeline { display: flex; justify-content: space-between; align-items: center; position: relative; max-width: 1100px; margin: 80px auto; padding: 0 40px; }
        .timeline::before { content: ''; position: absolute; top: 50%; left: 60px; right: 60px; height: 2px; background: linear-gradient(90deg, var(--glass-border) 0%, var(--accent-color) 50%, var(--glass-border) 100%); z-index: 1; }
        .timeline-node { position: relative; z-index: 2; background: var(--bg-color); border: 2px solid var(--accent-color); width: 24px; height: 24px; border-radius: 50%; box-shadow: 0 0 20px var(--accent-glow); }
        .node-today { border-color: #fff; box-shadow: 0 0 25px rgba(255,255,255,0.5); width: 28px; height: 28px; }
        .timeline-content { position: absolute; top: 45px; left: 50%; transform: translateX(-50%); width: 250px; background: rgba(255,255,255,0.03); padding: 1.5rem; border-radius: 20px; border: 1px solid var(--glass-border); backdrop-filter: blur(5px); }
        .timeline-content h4 { font-size: 1.1rem; color: var(--accent-color); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .timeline-content ul { list-style: none; padding: 0; margin: 0; text-align: left; font-size: 0.85rem; color: var(--text-dim); line-height: 1.6; }
        .timeline-content li { margin-bottom: 5px; display: flex; align-items: flex-start; gap: 8px; }
        .timeline-content li i { color: var(--accent-color); width: 14px; margin-top: 3px; }
        .timeline-content .date-badge { font-size: 0.7rem; font-weight: 800; background: rgba(0, 242, 255, 0.1); color: var(--accent-color); padding: 1px 6px; border-radius: 4px; margin-right: 5px; }

        .controls-section { margin-bottom: 50px; max-width: 1000px; margin-left: auto; margin-right: auto; background: var(--glass-bg); padding: 2rem; border-radius: 30px; border: 1px solid var(--glass-border); display: flex; flex-direction: column; gap: 1.5rem; }
        .filter-row { display: flex; gap: 2rem; align-items: center; flex-wrap: wrap; justify-content: center; }
        .filter-group { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
        .label { font-size: 0.75rem; color: var(--text-dim); font-weight: 800; text-transform: uppercase; letter-spacing: 1px; min-width: 70px; }
        .filter-btn { padding: 0.4rem 1.2rem; border-radius: 50px; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.05); color: var(--text-dim); cursor: pointer; transition: all 0.3s ease; font-size: 0.85rem; }
        .filter-btn.active { background: var(--accent-color); color: var(--bg-color); border-color: var(--accent-color); font-weight: 700; }
        .custom-select-wrapper { position: relative; user-select: none; width: 180px; }
        .custom-select { position: relative; display: flex; align-items: center; justify-content: space-between; padding: 0.4rem 1.2rem; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 50px; cursor: pointer; color: var(--text-color); font-size: 0.85rem; transition: all 0.3s ease; }
        .custom-options { position: absolute; top: calc(100% + 10px); left: 0; right: 0; background: var(--bg-color); border: 1px solid var(--glass-border); border-radius: 20px; overflow: hidden; display: none; z-index: 100; backdrop-filter: blur(20px); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .custom-option { padding: 0.8rem 1.2rem; cursor: pointer; transition: all 0.2s ease; color: var(--text-dim); font-size: 0.85rem; }
        .custom-option:hover { background: rgba(0, 242, 255, 0.1); color: var(--accent-color); }
        .project-list { display: grid; gap: 1.5rem; max-width: 900px; margin: 0 auto; }
        .project-card { display: flex; justify-content: space-between; align-items: center; padding: 2rem; border-radius: 20px; cursor: pointer; transition: transform 0.3s ease, border-color 0.3s ease; }
        .project-card:hover { transform: translateY(-3px); border-color: var(--accent-color); }
        .project-info { flex: 1; }
        .project-info h3 { margin-bottom: 0.5rem; font-size: 1.4rem; }
        .vote-controls { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; margin-left: 2rem; cursor: default; }
        .vote-arrow { background: none; border: 1px solid var(--glass-border); color: var(--text-dim); width: 36px; height: 36px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s ease; }
        .vote-arrow.active-up { background: #00ff88; color: #050508; border-color: #00ff88; }
        .vote-arrow.active-down { background: #ff4444; color: #fff; border-color: #ff4444; }
        .vote-score { font-weight: 800; font-size: 1.4rem; min-width: 40px; text-align: center; color: var(--text-color); }
        .tag-row { display: flex; gap: 8px; margin-bottom: 1rem; }
        .status-tag { padding: 0.3rem 0.8rem; border-radius: 4px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; }
        .status-planned { background: rgba(0, 242, 255, 0.1); color: #00f2ff; }
        .status-progress { background: rgba(255, 170, 0, 0.1); color: #ffaa00; }
        .status-published { background: rgba(0, 255, 136, 0.1); color: #00ff88; }
        .status-backlog { background: rgba(255, 255, 255, 0.1); color: #ccc; }
        .status-cancelled { background: rgba(255, 68, 68, 0.1); color: #ff4444; }
        .type-tag { padding: 0.3rem 0.8rem; border-radius: 4px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; background: rgba(112, 0, 255, 0.15); color: #7000ff; border: 1px solid rgba(112, 0, 255, 0.3); }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: var(--bg-color); border: 1px solid var(--glass-border); padding: 3rem; border-radius: 30px; max-width: 600px; width: 90%; position: relative; box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
        .close-modal { position: absolute; top: 20px; right: 20px; cursor: pointer; color: var(--text-dim); }
        @media (max-width: 992px) { .timeline { flex-direction: column; gap: 200px; margin-bottom: 300px; } .timeline::before { display: none; } .timeline-content { width: 300px; } }
    </style>
</head>
<body>
    <div class="background-glow"></div>
    <nav>
        <div class="container">
            <a href="index.html" class="logo">exus<span>541</span></a>
            <div class="nav-links">
                <a href="extensions.html"><i data-lucide="puzzle"></i> <span>Extensions</span></a>
                <a href="roadmap.html" class="active"><i data-lucide="map"></i> <span>Roadmap</span></a>
                <a href="index.html#feedback"><i data-lucide="message-square"></i> <span>Feedback</span></a>
                <a href="index.html#about"><i data-lucide="info"></i> <span>About</span></a>
                <a href="index.html#socials"><i data-lucide="share-2"></i> <span>Socials</span></a>
                <a href="https://www.patreon.com/c/exus541" class="btn-primary" target="_blank"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M15.386 0.501c-4.139 0-7.511 3.372-7.511 7.511 0 4.139 3.372 7.511 7.511 7.511s7.511-3.372 7.511-7.511c0-4.139-3.372-7.511-7.511-7.511zM0 0.501v22.998h4.28v-22.998h-4.28z"/></svg> <span>Support on Patreon</span></a>
            </div>
        </div>
    </nav>

    <main class="container">
        <section class="timeline-container">
            <h1 class="reveal">Project <span>Journey</span></h1>
            <p>Transparency in development. Follow the evolution of the exus541 tool suite.</p>
            <div class="timeline" id="roadmapTimeline">
                <!-- Timeline items will be loaded from JSON -->
            </div>
        </section>

        <section class="projects-section" style="margin-top: 150px;">
            <div class="controls-section">
                <!-- Status Filters -->
                <div class="filter-row">
                    <span class="label">Status:</span>
                    <div class="filter-group" id="statusFilters">
                        <button class="filter-btn active" data-filter="all">All</button>
                        <button class="filter-btn" data-filter="backlog">Backlog</button>
                        <button class="filter-btn" data-filter="planned">Planned</button>
                        <button class="filter-btn" data-filter="progress">In Progress</button>
                        <button class="filter-btn" data-filter="published">Published</button>
                        <button class="filter-btn" data-filter="cancelled">Cancelled</button>
                    </div>
                </div>
                <!-- Sorting -->
                <div class="filter-row" style="margin-top: 0.5rem; border-top: 1px solid var(--glass-border); padding-top: 1.5rem;">
                    <span class="label">Sort By:</span>
                    <div class="custom-select-wrapper">
                        <div class="custom-select" id="customSelect"><span id="selectedSort">Top Upvotes</span><i data-lucide="chevron-down"></i></div>
                        <div class="custom-options" id="customOptions">
                            <div class="custom-option selected" data-value="votes">Top Upvotes</div>
                            <div class="custom-option" data-value="az">Name (A-Z)</div>
                            <div class="custom-option" data-value="status">Status Priority</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="project-list" id="projectList">
                <p style="text-align: center; color: var(--text-dim); margin-top: 2rem;">Loading roadmap projects...</p>
            </div>
        </section>
    </main>

    <div class="modal-overlay" id="modalOverlay" onclick="closeModal()"><div class="modal-content glass" onclick="event.stopPropagation()"><div class="close-modal" onclick="closeModal()"><i data-lucide="x"></i></div><div id="modalBody"></div></div></div>
    <footer style="margin-top: 100px;"><div class="container"><p>&copy; 2026 exus541. Built with ❤️</p></div></footer>

    <script>
        const dateElement = document.getElementById('currentDate');
        const now = new Date();
        const options = { day: 'numeric', month: 'long', year: 'numeric' };

        let projects = [];
        const statusOrder = { "progress": 0, "planned": 1, "backlog": 2, "published": 3, "cancelled": 4 };
        let currentSort = 'votes';
        let activeStatuses = ['all'];

        async function loadRoadmapData() {
            try {
                const response = await fetch('roadmap-data.json');
                const data = await response.json();
                
                projects = data.projects;
                renderTimeline(data.timeline);
                renderProjects();
            } catch (error) {
                console.error('Error loading roadmap data:', error);
                document.getElementById('projectList').innerHTML = '<p style="text-align: center; color: #ff4444;">Failed to load roadmap data. Please try again later.</p>';
            }
        }

        function renderTimeline(timelineData) {
            const container = document.getElementById('roadmapTimeline');
            container.innerHTML = `
                <div class="timeline-node"><div class="timeline-content"><h4>Store Releases</h4><ul>${timelineData.releases.map(r => `<li><i data-lucide="check-circle-2"></i> <span class="date-badge">${r.date}</span> ${r.name}</li>`).join('')}</ul></div></div>
                <div class="timeline-node node-today"><div class="timeline-content" style="border-color: #fff;"><h4 class="today-label">TODAY</h4><div class="today-date">${new Date().toLocaleDateString('en-US', { day: 'numeric', month: 'long', year: 'numeric' })}</div><p style="margin: 10px 0 5px 0; font-size: 0.8rem; color: #fff; font-weight: 600;">ACTIVE WORK ON:</p><ul>${timelineData.activeWork.map(w => `<li><i data-lucide="code-2"></i> ${w}</li>`).join('')}</ul></div></div>
                <div class="timeline-node"><div class="timeline-content"><h4>Upcoming Focus</h4><ul>${timelineData.upcoming.map(u => `<li><i data-lucide="arrow-right-circle"></i> ${u}</li>`).join('')}</ul></div></div>
            `;
            lucide.createIcons();
        }

        function renderProjects() {
            const list = document.getElementById('projectList'); 
            list.innerHTML = '';
            
            let filtered = projects.filter(p => activeStatuses.includes('all') || activeStatuses.includes(p.status));
            
            if (filtered.length === 0) {
                list.innerHTML = '<p style="text-align: center; color: var(--text-dim); margin-top: 2rem;">No projects found for the selected filter.</p>';
                return;
            }

            if (currentSort === 'votes') filtered.sort((a, b) => b.votes - a.votes);
            else if (currentSort === 'az') filtered.sort((a, b) => a.title.localeCompare(b.title));
            else if (currentSort === 'status') filtered.sort((a, b) => statusOrder[a.status] - statusOrder[b.status]);
            
            filtered.forEach(p => {
                const userVote = localStorage.getItem(`vote_${p.id}`);
                const card = document.createElement('div'); card.className = 'project-card glass'; card.onclick = () => openModal(p.id);
                card.innerHTML = `<div class="project-info"><div class="tag-row"><span class="status-tag status-${p.status}">${p.status}</span><span class="type-tag">${p.type}</span></div><h3>${p.title}</h3><p>${p.desc}</p></div><div class="vote-controls" onclick="event.stopPropagation()"><button class="vote-arrow ${userVote === 'up' ? 'active-up' : ''}" onclick="handleVote(${p.id}, 'up')" title="Upvote"><i data-lucide="chevron-up"></i></button><div class="vote-score">${p.votes}</div><button class="vote-arrow ${userVote === 'down' ? 'active-down' : ''}" onclick="handleVote(${p.id}, 'down')" title="Downvote"><i data-lucide="chevron-down"></i></button></div>`;
                list.appendChild(card);
            });
            lucide.createIcons();
        }

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const filter = this.dataset.filter;
                if (filter === 'all') { activeStatuses = ['all']; document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active')); this.classList.add('active'); }
                else { activeStatuses = activeStatuses.filter(f => f !== 'all'); document.querySelector('.filter-btn[data-filter="all"]').classList.remove('active'); if (activeStatuses.includes(filter)) { activeStatuses = activeStatuses.filter(f => f !== filter); this.classList.remove('active'); } else { activeStatuses.push(filter); this.classList.add('active'); } if (activeStatuses.length === 0) { activeStatuses = ['all']; document.querySelector('.filter-btn[data-filter="all"]').classList.add('active'); } }
                renderProjects();
            });
        });

        const customSelect = document.getElementById('customSelect'); const customOptions = document.getElementById('customOptions'); const selectedSortText = document.getElementById('selectedSort');
        customSelect.addEventListener('click', (e) => { e.stopPropagation(); customSelect.classList.toggle('open'); customOptions.style.display = customSelect.classList.contains('open') ? 'block' : 'none'; });
        document.querySelectorAll('.custom-option').forEach(option => { option.addEventListener('click', function() { currentSort = this.dataset.value; selectedSortText.innerText = this.innerText; document.querySelector('.custom-option.selected').classList.remove('selected'); this.classList.add('selected'); renderProjects(); customSelect.classList.remove('open'); customOptions.style.display = 'none'; }); });
        document.addEventListener('click', () => { customSelect.classList.remove('open'); customOptions.style.display = 'none'; });
        
        function openModal(id) { const p = projects.find(item => item.id === id); const body = document.getElementById('modalBody'); body.innerHTML = `<div class="modal-header"><div class="tag-row"><span class="status-tag status-${p.status}">${p.status}</span><span class="type-tag">${p.type}</span></div><h2>${p.title}</h2></div><div class="modal-body"><p>${p.fullDesc}</p></div>`; document.getElementById('modalOverlay').style.display = 'flex'; lucide.createIcons(); }
        function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }
        function handleVote(id, type) { const p = projects.find(x => x.id === id); const cur = localStorage.getItem(`vote_${id}`); if (cur === type) { p.votes += (type === 'up' ? -1 : 1); localStorage.removeItem(`vote_${id}`); } else { if (cur) p.votes += (cur === 'up' ? -1 : 1); p.votes += (type === 'up' ? 1 : -1); localStorage.setItem(`vote_${id}`, type); } renderProjects(); }
        
        loadRoadmapData();
    </script>
</body>
</html>
